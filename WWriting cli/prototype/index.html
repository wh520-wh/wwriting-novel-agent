<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="WWriting 命令行写作 Agent 的交互原型">
<title>WWriting · 星坠之城</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #171a19;
    --surface: #202423;
    --surface-raised: #292e2c;
    --line: #363c39;
    --line-strong: #4a534e;
    --text: #e9ede9;
    --muted: #a5aea8;
    --quiet: #78837d;
    --accent: #b8d4c1;
    --warning: #e3b781;
    --danger: #e29a94;
    --ui: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --serif: "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", serif;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.6 var(--ui); }
  button, textarea, input { font: inherit; }
  button { color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 3px;
  }
  ::selection { background: #a6c8b755; }
  .app { display: flex; flex-direction: column; width: min(1440px, 100%); height: 100dvh; margin: auto; position: relative; }
  .topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 34px; border-bottom: 1px solid var(--line); }
  .brand { font: 700 17px/1 var(--serif); color: var(--text); }
  .top-separator { height: 17px; border-left: 1px solid var(--line-strong); }
  .top-project { color: var(--muted); font-size: 12px; }
  .top-right { display: flex; align-items: center; gap: 14px; margin-left: auto; }
  .prototype-note { color: var(--quiet); font-size: 11px; }
  .icon-button { width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 20px; }
  .icon-button:hover { background: var(--surface-raised); color: var(--text); }

  .screen { flex: 1; min-height: 0; overflow: auto; scrollbar-color: #4a534e transparent; scrollbar-width: thin; }
  .thread { width: min(1010px, 100%); min-height: 100%; margin: 0 auto; padding: 0 30px 60px; }
  .intro { max-width: 750px; padding: 56px 0 30px; }
  .intro-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .intro-label { margin: 0 0 9px; color: var(--quiet); font-size: 11px; }
  .intro h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.35; letter-spacing: 0; }
  .intro-sub { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .chapter-count { flex: none; text-align: right; color: var(--text); font: 400 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
  .chapter-count span { color: var(--quiet); font-size: 12px; }
  .intro-rule { height: 1px; margin: 29px 0 0; background: var(--line); }
  .action-list { max-width: 750px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; margin-top: 14px; }
  .action-item { display: flex; align-items: center; width: 100%; min-height: 45px; padding: 0 1px; border: 0; border-bottom: 1px solid #303633; background: transparent; text-align: left; color: var(--muted); transition: color .16s, padding .16s; }
  .action-item:first-child { color: var(--text); font-weight: 600; }
  .action-item:hover:not(:disabled) { color: var(--text); padding-left: 7px; }
  .action-item .item-arrow { margin-left: auto; color: var(--quiet); font: 17px/1 var(--mono); }
  .action-item:hover .item-arrow { color: var(--accent); }

  .turn { max-width: 750px; margin-top: 34px; animation: enter .2s ease-out both; }
  .user-message { display: flex; justify-content: flex-end; margin-bottom: 21px; }
  .user-message span { max-width: min(700px, calc(100% - 32px)); padding: 9px 13px; border-radius: 7px; background: #313734; color: var(--text); line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .work { max-width: 720px; margin: 0 0 22px; }
  .work > summary { display: flex; align-items: center; gap: 9px; min-height: 26px; width: fit-content; max-width: 100%; list-style: none; cursor: pointer; color: var(--muted); font-size: 12px; }
  .work > summary::-webkit-details-marker, .activity > summary::-webkit-details-marker { display: none; }
  .work > summary:hover, .activity > summary:hover { color: var(--text); }
  .work-toggle { color: var(--quiet); font: 12px/1 var(--mono); transition: transform .18s; }
  .work[open] .work-toggle { transform: rotate(90deg); }
  .work-title { white-space: nowrap; }
  .work-count { color: var(--quiet); font: 11px/1 var(--mono); }
  .work-body { margin: 9px 0 0 18px; padding-left: 15px; border-left: 1px solid var(--line); }
  .activity { position: relative; max-width: 690px; margin: 0 0 1px; }
  .activity > summary { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto 12px; align-items: baseline; gap: 8px; min-height: 32px; padding: 5px 2px; list-style: none; cursor: pointer; color: var(--muted); }
  .activity-label { color: var(--text); white-space: nowrap; }
  .activity-target { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 11px/1.6 var(--mono); }
  .activity-tail { color: var(--quiet); white-space: nowrap; font: 11px/1.5 var(--mono); }
  .activity-caret { color: var(--quiet); font: 11px/1.5 var(--mono); }
  .activity[open] .activity-caret { transform: rotate(90deg); }
  .activity.running .activity-label { color: var(--accent); }
  .activity.running::before { content: ""; position: absolute; top: 12px; left: -16px; width: 1px; height: 13px; background: var(--accent); animation: breathe 1.2s ease-in-out infinite; }
  .activity.failed .activity-label { color: var(--danger); }
  .activity.stopped .activity-label { color: var(--quiet); }
  .activity-detail { padding: 0 0 9px 89px; color: var(--muted); font-size: 11px; }
  .detail-row { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; margin: 3px 0; }
  .detail-key { color: var(--quiet); }
  .detail-value { overflow-wrap: anywhere; }
  .detail-value strong { color: var(--text); }
  .detail-file { padding: 4px 0; font-family: var(--mono); overflow-wrap: anywhere; }
  .detail-file + .detail-file { border-top: 1px solid #303633; }
  .detail-file small { display: block; color: var(--quiet); font: 11px/1.7 var(--ui); }
  .draft-peek { max-width: 660px; margin: 11px 0 18px; padding: 6px 0 6px 16px; border-left: 2px solid #7c9182; color: #cdd5cc; font: 13px/2 var(--serif); }
  .draft-peek p { margin: 0; }
  .draft-peek small { display: block; margin-top: 7px; color: var(--quiet); font: 11px/1.4 var(--ui); }
  .assistant-message { max-width: 720px; color: var(--text); font: 15px/2 var(--serif); overflow-wrap: anywhere; }
  .assistant-message p { margin: 0 0 10px; }
  .assistant-message p:last-child { margin-bottom: 0; }
  .assistant-message strong { font-weight: 700; }
  .assistant-message code, .command-output code { padding: 1px 3px; border-radius: 3px; color: #c8d9cd; background: #29322c; font: 11px/1.5 var(--mono); overflow-wrap: anywhere; }
  .terminal-line { margin-top: 15px; color: var(--quiet); font-size: 11px; }
  .terminal-line.failed, .terminal-line.interrupted { color: var(--danger); }

  .permission { max-width: 660px; margin: 16px 0 18px; padding: 16px 17px 14px; border: 1px solid #80694f; border-radius: 6px; background: #282725; animation: enter .18s ease-out both; }
  .permission.extreme { border-color: #8e5c57; background: #2b2423; }
  .permission-title { margin-bottom: 8px; color: var(--warning); font-size: 13px; font-weight: 600; }
  .permission.extreme .permission-title { color: var(--danger); }
  .permission-body { color: #d5d8d1; font-size: 12px; line-height: 1.85; overflow-wrap: anywhere; }
  .permission-body .path { color: var(--text); font-family: var(--mono); }
  .permission-body code { color: var(--text); font-family: var(--mono); }
  .confirm-text { display: inline-block; margin-top: 6px; color: var(--danger); font: 12px/1.6 var(--mono); }
  .permission-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
  .text-button { min-height: 30px; padding: 4px 9px; border: 1px solid var(--line-strong); border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .text-button:hover:not(:disabled) { background: #343a36; color: var(--text); }
  .text-button.primary { border-color: #d6ddd4; background: #d6ddd4; color: #1c2420; font-weight: 600; }
  .text-button.primary:hover:not(:disabled) { background: #eff2ed; }
  .text-button.danger { border-color: var(--danger); background: #8d4643; color: #fff0ee; }
  .text-button.danger:hover:not(:disabled) { background: #ab5752; }
  .confirm-input { width: min(270px, 100%); min-height: 32px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: #1d201e; color: var(--text); outline: none; }
  .confirm-input::placeholder { color: var(--quiet); }
  .confirm-input:focus { border-color: var(--danger); }

  .command-output { max-width: 720px; margin: 28px 0; animation: enter .2s ease-out both; }
  .command-output h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .command-content { color: var(--muted); font-size: 12px; line-height: 1.85; }
  .command-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; padding: 4px 0; }
  .command-row span:first-child { color: var(--text); }
  .command-row span:last-child { overflow-wrap: anywhere; }
  .command-foot { margin: 10px 0 0; color: var(--quiet); }
  .skill-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 26px; }
  .skill-list div { padding: 3px 0; }
  .skill-list code { margin-right: 8px; }
  .progress-track { width: min(280px, 100%); height: 2px; margin: 11px 0; background: var(--line); }
  .progress-track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .plan-panel { position: absolute; z-index: 5; top: 72px; right: max(24px, calc((100% - 1320px) / 2)); width: 250px; max-width: calc(100% - 24px); border: 1px solid var(--line-strong); border-radius: 6px; background: #252a28; box-shadow: 0 12px 32px #10131088; }
  .plan-head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 7px 12px; border: 0; background: transparent; text-align: left; color: var(--text); font-size: 12px; }
  .plan-head:hover { background: #303633; }
  .plan-count { margin-left: auto; color: var(--quiet); font: 11px/1 var(--mono); }
  .plan-caret { color: var(--quiet); font: 11px/1 var(--mono); }
  .plan-items { padding: 0 12px 8px; }
  .plan-item { display: grid; grid-template-columns: 16px 1fr; gap: 5px; padding: 5px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .plan-item.done { color: var(--quiet); text-decoration: line-through; }
  .plan-item.doing { color: var(--text); }
  .plan-marker { font: 11px/1.5 var(--mono); text-decoration: none; }
  .plan-more { padding: 0 12px 10px; color: var(--quiet); font-size: 11px; }

  .dock { flex: none; border-top: 1px solid var(--line); background: var(--bg); }
  .dock-inner { width: min(1010px, 100%); margin: 0 auto; padding: 12px 30px 18px; }
  .queue { max-width: 750px; padding: 0 0 10px; }
  .queue-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--muted); font-size: 12px; }
  .queue-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-state { margin-left: auto; color: var(--quiet); font-size: 11px; }
  .queue-now { padding: 1px 4px; border: 0; background: transparent; color: var(--text); font-size: 11px; }
  .queue-now:hover { text-decoration: underline; }
  .live { display: flex; align-items: center; gap: 8px; max-width: 750px; min-height: 30px; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  .live.running .live-label { color: var(--text); }
  .live.wait .live-label { color: var(--warning); }
  .live.stop .live-label { color: var(--quiet); }
  .live-hint { color: var(--quiet); font-size: 11px; }
  .stop-button { margin-left: auto; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); font-size: 11px; }
  .stop-button:hover:not(:disabled) { color: var(--danger); }
  .composer { position: relative; max-width: 750px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 25px #0e110e36; transition: border-color .16s; }
  .composer:focus-within { border-color: #91ad98; }
  .composer textarea { display: block; width: 100%; height: 72px; resize: none; padding: 13px 14px 3px; border: 0; outline: none; background: transparent; color: var(--text); line-height: 1.6; }
  .composer textarea::placeholder { color: var(--quiet); opacity: 1; }
  .composer-bar { display: flex; align-items: center; gap: 4px; padding: 0 8px 7px; }
  .bar-button { padding: 5px 6px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); font-size: 11px; }
  .bar-button:hover { background: var(--surface-raised); color: var(--text); }
  .bar-button.yolo { color: var(--warning); }
  .bar-static { padding: 5px 6px; color: var(--quiet); font-size: 11px; }
  .send-button { width: 29px; height: 29px; margin-left: auto; border: 0; border-radius: 5px; background: #dce5dc; color: #1d2720; font: 21px/1 var(--mono); }
  .send-button:hover { background: #f2f5f0; }
  .menu { position: absolute; z-index: 8; left: 0; bottom: calc(100% + 8px); width: min(430px, 100%); max-height: min(380px, 50dvh); overflow: auto; padding: 5px; border: 1px solid var(--line-strong); border-radius: 7px; background: #292e2b; box-shadow: 0 12px 30px #0b100dc7; animation: enter .14s ease-out both; }
  .menu-item { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 9px; width: 100%; padding: 7px 8px; border: 0; border-radius: 4px; background: transparent; text-align: left; color: var(--muted); font-size: 12px; }
  .menu-item:hover, .menu-item.selected { background: #3a413c; color: var(--text); }
  .menu-item span:first-child { font-family: var(--mono); color: var(--text); }
  .menu-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .overlay { position: absolute; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: #090d0bcc; }
  .dialog { width: min(420px, 100%); padding: 20px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-raised); box-shadow: 0 18px 60px #05080599; }
  .dialog h2 { margin: 0 0 9px; font-size: 15px; }
  .dialog p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes breathe { 50% { opacity: .25; } }
  @media (max-width: 760px) {
    .topbar { padding: 0 20px; }
    .thread, .dock-inner { padding-left: 20px; padding-right: 20px; }
    .plan-panel { right: 12px; width: min(250px, calc(100% - 24px)); }
  }
  @media (max-width: 560px) {
    .topbar { height: 50px; padding: 0 16px; }
    .prototype-note { display: none; }
    .thread { padding: 0 16px 30px; }
    .intro { padding-top: 34px; }
    .intro h1 { font-size: 26px; }
    .chapter-count { font-size: 20px; }
    .action-list { grid-template-columns: 1fr; }
    .action-item { min-height: 43px; }
    .turn { margin-top: 26px; }
    .activity > summary { grid-template-columns: 65px minmax(0, 1fr) auto 10px; gap: 5px; }
    .activity-detail { padding-left: 70px; }
    .activity-tail { max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
    .plan-panel { top: auto; bottom: 175px; }
    .app:has(.permission) .plan-panel { display: none; }
    .dock-inner { padding: 8px 12px 10px; }
    .queue-item { display: grid; grid-template-columns: 1fr auto auto; }
    .queue-text { grid-column: 1 / -1; }
    .queue-state { margin-left: 0; }
    .command-row { grid-template-columns: 104px minmax(0, 1fr); }
    .skill-list { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .overlay { background: #090d0b; }
  }
  @media (prefers-contrast: more) {
    :root { --muted: #c7d0c8; --quiet: #aeb9af; --line: #69756b; --line-strong: #9ca99d; }
    .composer, .permission, .plan-panel, .dialog { box-shadow: none; }
  }

  /* The manuscript is the visual anchor; controls stay quiet until needed. */
  :root {
    color-scheme: light;
    --bg: #f5f7f4;
    --surface: #ffffff;
    --surface-raised: #edf1eb;
    --line: #dce2da;
    --line-strong: #b8c3b8;
    --text: #1b2720;
    --muted: #536258;
    --quiet: #66776c;
    --accent: #255640;
    --warning: #935b20;
    --danger: #a83e39;
  }
  body { background: #e9eeea; color: var(--text); font-size: 13px; }
  .app { background: var(--bg); box-shadow: 0 0 0 1px #dce2da; }
  .topbar { height: 60px; padding-inline: 35px; background: #fff; border-top: 3px solid #255640; border-bottom-color: var(--line); }
  .brand { color: #1d3327; font-size: 18px; }
  .top-separator { border-color: #c3cfc5; }
  .top-project { color: #5b6e60; font-size: 13px; }
  .prototype-note { color: #75847a; }
  .icon-button { color: #586d5d; }
  .icon-button:hover { background: #edf1eb; color: #183f29; }
  .demo-return { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 8px; border: 0; border-radius: 4px; background: transparent; color: #315a3f; font-size: 12px; }
  .demo-return:hover:not(:disabled) { background: #eaf0e8; }
  .thread { width: min(1080px, 100%); padding-inline: 35px; }
  .intro { max-width: 900px; padding: 41px 0 10px; }
  .intro-top { align-items: flex-end; }
  .intro-label { margin: 0 0 18px; color: #55715e; font-size: 12px; font-weight: 600; }
  .intro-label span { padding: 0 7px; color: #8ca092; }
  .intro h1 { font-family: var(--ui); font-size: clamp(36px, 4vw, 48px); font-weight: 700; line-height: 1.25; color: #18281d; }
  .intro-sub { margin-top: 13px; color: #5a6d60; font-size: 13px; }
  .intro-divider { padding: 0 7px; color: #9aaba0; }
  .chapter-count { display: flex; align-items: baseline; gap: 3px; color: #244f38; font-size: 17px; }
  .chapter-count strong { font-size: 40px; font-weight: 500; }
  .chapter-count span { color: #73867a; font-size: 16px; }
  .chapter-count small { margin-left: 7px; font: 12px/1 var(--ui); color: #73867a; }
  .excerpt { max-width: 745px; margin: 36px 0 20px; padding: 21px 28px 23px; border-left: 3px solid #295640; background: #e9eee7; }
  .excerpt-meta { display: flex; gap: 16px; color: #295640; font-size: 11px; font-weight: 600; }

  .featured-demo { display: flex; align-items: center; gap: 17px; width: min(745px, 100%); min-height: 78px; padding: 15px 21px; border: 1px solid #1d3928; border-radius: 6px; background: #1d3928; color: #f6f8f3; text-align: left; transition: background .18s, transform .18s; }
  .featured-demo:hover:not(:disabled) { background: #2a523a; transform: translateY(-2px); }
  .demo-play { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border: 1px solid #83a48b; border-radius: 50%; color: #e8f2e7; font-size: 12px; padding-left: 2px; }
  .featured-demo strong { display: block; font-size: 15px; font-weight: 600; }
  .featured-demo small { display: block; margin-top: 3px; color: #bed0bd; font-size: 11px; line-height: 1.5; }
  .demo-go { margin-left: auto; color: #c9decb; font-size: 19px; }

  .action-heading { grid-column: 1 / -1; padding: 10px 0 4px; color: #75837a; font-size: 11px; }
  .action-item { min-height: 43px; border-color: #d9e0d8; color: #314338; font-size: 12px; }
  .action-item:first-of-type { color: #314338; font-weight: 400; }
  .action-item:hover:not(:disabled) { color: #16462c; }
  .action-item .item-arrow, .action-item:hover .item-arrow { color: #688570; }
  .turn { max-width: 780px; margin-top: 32px; }
  .user-message span { background: #e7ede7; color: #24352a; border: 1px solid #dce5db; }
  .work > summary { color: #53665a; }
  .work > summary:hover, .activity > summary:hover { color: #1b3425; }

  .activity-label { color: #25382b; }
  .activity-target, .activity-tail, .activity-caret { color: #6e8072; }

<script>
'use strict';
const $ = (selector, root = document) => root.querySelector(selector);
const make = (tag, className, html) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html != null) node.innerHTML = html;
  return node;
};
const esc = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const screen = $('#screen'), thread = $('#thread'), input = $('#input');
const live = $('#live'), liveLabel = $('#liveLabel'), liveHint = $('#liveHint'), stopBtn = $('#stopBtn');
const queueEl = $('#queue'), menuEl = $('#menu'), planEl = $('#planPanel'), overlay = $('#overlay');
const S = { busy: false, stopped: false, stopKind: 'stop', yolo: false, sameAuth: false,
  plan: null, lastPlan: null, planOpen: false, menu: null, menuIndex: 0,
  history: [], historyIndex: 0, queue: [], promoted: null, permissionDone: null, current: null };
let timers = new Set(), stick = true, sceneButtons = [];
screen.addEventListener('scroll', () => { stick = screen.scrollHeight - screen.scrollTop - screen.clientHeight < 60; });
function append(node, parent = thread) { parent.appendChild(node); if (stick) screen.scrollTop = screen.scrollHeight; return node; }
function sleep(ms) {
  return new Promise(resolve => {
    const item = { id: null, resolve };
    item.id = setTimeout(() => { timers.delete(item); resolve(); }, ms);
    timers.add(item);
  });

function askPermission(turn, options) {
  return new Promise(resolve => {

      card.remove(); if (!S.stopped) setLive('running', '运行中'); resolve(choice);

      const execute = append(make('button', 'text-button danger', '执行删除'), actions); execute.disabled = true;
      append(make('button', 'text-button', '取消'), actions).addEventListener('click', () => done('deny'));
      field.addEventListener('input', () => { execute.disabled = field.value !== options.confirmText; });
      execute.addEventListener('click', () => done('allow'));

    } else {
      append(make('button', 'text-button primary', '一次允许'), actions).addEventListener('click', () => done('allow'));
      append(make('button', 'text-button', '本条输入允许同类操作'), actions).addEventListener('click', () => { S.sameAuth = true; done('same'); });
      append(make('button', 'text-button', '拒绝'), actions).addEventListener('click', () => done('deny'));

}

function handleInput(raw) {
  const text = raw.trim(); if (!text) return;
  if (S.busy) { enqueue(text); return; }
  if (text.startsWith('/')) {
    const command = text.split(/\s+/)[0];
    switch (command) {
      case '/init': return runInit();
      case '/skills': return commandSkills();
      case '/model': return commandModel();
      case '/cost': return commandCost();
      case '/plan': return commandPlan();
      case '/compact': return commandCompact();
      case '/export': return commandExport();
      case '/yolo': return openYolo();
      case '/clear': return clearScreen();
      case '/help': return commandHelp();
      case '/stop': return output('停止', '当前没有运行中的任务。');
      default: return output('未知命令', '输入 /help 查看命令。');
    }
  }
  if (/先改第三章结尾|改写.*结尾/.test(text)) return runRevise();
  if (/清空|删除 drafts/.test(text)) return runExtreme();
  if (/第\s*3\s*章|第三章/.test(text)) return runChapter();
  const turn = startTurn(text);
  (async () => { try { await think(600); assistant(turn, '<p>当前原型未连接模型，无法处理这条输入。</p>'); endTurn(turn); } catch (error) { if (error?.stopped) aborted(turn); else throw error; } })();
}
function sendInput() {
  if (demoTyping) return;
  const text = input.value.trim(); if (!text) return;
  closeMenu(); S.history.push(text); S.historyIndex = S.history.length;
  input.value = ''; handleInput(text); input.focus();
}
$('#sendBtn').addEventListener('click', sendInput);
input.addEventListener('keydown', event => {
  if (S.menu) {
    const items = menuItems();
    if (event.key === 'ArrowDown') { event.preventDefault(); S.menuIndex = (S.menuIndex + 1) % items.length; renderMenu(); return; }
    if (event.key === 'ArrowUp') { event.preventDefault(); S.menuIndex = (S.menuIndex - 1 + items.length) % items.length; renderMenu(); return; }
    if (event.key === 'Enter' || event.key === 'Tab') { event.preventDefault(); pickMenu(); return; }
    if (event.key === 'Escape') { event.preventDefault(); closeMenu(); return; }
  }
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendInput(); return; }
  if (event.key === 'ArrowUp' && !input.value && S.history.length) { event.preventDefault(); S.historyIndex = Math.max(0, S.historyIndex - 1); input.value = S.history[S.historyIndex]; return; }
  if (event.key === 'ArrowDown' && S.historyIndex < S.history.length) { event.preventDefault(); S.historyIndex++; input.value = S.history[S.historyIndex] || ''; }
});
document.addEventListener('keydown', event => {
  if (event.defaultPrevented) return;
  if (event.ctrlKey && event.key.toLowerCase() === 'c' && S.busy) { event.preventDefault(); requestStop(); }
  if (event.ctrlKey && event.key.toLowerCase() === 'l') { event.preventDefault(); if (!S.busy) clearScreen(); }
  if (event.key === 'Tab' && event.shiftKey && document.activeElement === input && !S.menu) { event.preventDefault(); openYolo(); }
  if (event.key === 'Escape' && !overlay.hidden) { overlay.hidden = true; input.focus(); }
});
document.addEventListener('click', event => { if (!menuEl.hidden && !$('#composer').contains(event.target)) closeMenu(); });

function intro() {
  append(make('section', 'intro opening-only',
    '<div class="cli-logo">星坠之城 <span>长篇写作工作区</span></div>' +
    '<div class="cli-facts"><span>工作区</span><code>D:\\Novels\\星坠之城</code>' +
    '<span>章节</span><span>已完成 2 / 12 · 下一章「长街灯火」</span>' +
    '<span>记忆</span><span>WWRITING.md 待建立</span>' +
    '<span>恢复</span><span>上次会话已恢复</span></div>' +
    '<div class="cli-divider"></div>' +
    '<div class="action-heading">演示场景</div>' +
    '<button class="featured-demo" id="fullDemo"><span class="demo-num">01</span><span><strong>完整演示 · 写第 3 章</strong><small>读取资料 · 写入确认 · 流式草稿 · 字数校验 · 提交</small></span></button>'));
  $('#fullDemo').addEventListener('click', playFullDemo);
  sceneButtons.push($('#fullDemo'));
  const actions = append(make('nav', 'action-list opening-only', ''), thread);
  const scenes = [
    ['/init', '建立项目记忆', runInit], ['改稿', '第三章结尾', runRevise],
    ['队列', '排队与立即', () => runChapter(true)], ['权限', '极端操作确认', runExtreme],
    ['/skills', '查看写作技能', commandSkills]
  ];
  scenes.forEach(([command, label, action], index) => {
    const button = append(make('button', 'action-item', '<span class="action-index">' + String(index + 2).padStart(2, '0') + '</span><span class="action-cmd">' + esc(command) + '</span><span class="action-desc">' + esc(label) + '</span><span class="item-arrow">↵</span>'), actions);
    button.addEventListener('click', () => { if (!S.busy) action(); }); sceneButtons.push(button);
  });
}
let demoTyping = false;
async function playFullDemo() {
  if (S.busy || demoTyping) return;
  if (input.value.trim() || matchMedia('(prefers-reduced-motion: reduce)').matches) { runChapter(); return; }
  demoTyping = true; setScenes(false); input.readOnly = true;
  $('#sendBtn').disabled = true;
  $('#composer').classList.add('demo-typing'); input.focus({ preventScroll: true });
  const prompt = '继续写第 3 章。按提纲来，快节奏一点，全文至少 2000 字。';
  for (const char of prompt) { input.value += char; await sleep(20); }
  await sleep(260);
  input.value = ''; input.readOnly = false; demoTyping = false;
  $('#sendBtn').disabled = false;
  $('#composer').classList.remove('demo-typing'); runChapter();
}
intro(); input.focus({ preventScroll: true }); screen.scrollTop = 0;
const query = new URLSearchParams(location.search);
if (query.get('yolo') === '1') { S.yolo = true; $('#modeBtn').textContent = 'YOLO'; $('#modeBtn').classList.add('yolo'); }
if (query.has('auto')) setTimeout(() => {
  const scene = query.get('auto');
  if (scene === 'chapter') runChapter();
  else if (scene === 'init') runInit();
  else if (scene === 'extreme') runExtreme();
  else if (scene === 'revise') runRevise();
}, 500);
</script>
